<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title description">
  <title id="title">WSL and Ubuntu share a VHDX</title>
  <desc id="description">Windows Subsystem for Linux and a native Ubuntu boot connect to the same virtual disk.</desc>
  <rect width="1000" height="190" rx="8" fill="#f7f8fa"/>

  <g fill="#0078d4">
    <rect x="116" y="43" width="27" height="27"/>
    <rect x="148" y="43" width="27" height="27"/>
    <rect x="116" y="75" width="27" height="27"/>
    <rect x="148" y="75" width="27" height="27"/>
  </g>
  <text x="145" y="145" text-anchor="middle" fill="#24292f" font-family="Arial, sans-serif" font-size="22">WSL 2</text>

  <path d="M220 72 H384 M616 72 H780" fill="none" stroke="#a0a8b3" stroke-width="2"/>
  <circle cx="220" cy="72" r="4" fill="#a0a8b3"/>
  <circle cx="780" cy="72" r="4" fill="#a0a8b3"/>
  <rect x="384" y="42" width="232" height="60" rx="7" fill="#fff" stroke="#a0a8b3" stroke-width="2"/>
  <text x="500" y="80" text-anchor="middle" fill="#24292f" font-family="Arial, sans-serif" font-size="20">Shared VHDX</text>

  <g fill="none" stroke="#e95420" stroke-width="8">
    <circle cx="854" cy="72" r="24"/>
  </g>
  <g fill="#e95420" stroke="#f7f8fa" stroke-width="3">
    <circle cx="854" cy="42" r="7"/>
    <circle cx="828" cy="87" r="7"/>
    <circle cx="880" cy="87" r="7"/>
  </g>
  <text x="854" y="145" text-anchor="middle" fill="#24292f" font-family="Arial, sans-serif" font-size="22">Ubuntu</text>
</svg>
